name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎週月曜 09:00 JST。日本郵便側のダウンロードURL変更を検知する
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit test (Java ${{ matrix.java }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run tests (excluding network tests)
        run: mvn -B -ntp test -DexcludedGroups=network

      - name: Publish JUnit report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          include_passed: true
          require_tests: true

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-java${{ matrix.java }}
          path: '**/target/surefire-reports/'

  network-test:
    name: Network test (japanpost.jp)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run network tests
        run: mvn -B -ntp test -Dgroups=network

      - name: Publish JUnit report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          include_passed: true
          require_tests: true
